<!doctype html><html><head><meta charset=utf-8>
<script src="lib/three.min.js"></script>
<style>body{background:#191a1e} #world-view-canvas{width:640px;height:340px;display:block}</style>
</head><body>
<script>
var mapData = [[{type:'central-town', name:'Central Town'}]];
var playerPosition = {x:0, y:0};
var player = { class:'Warrior', equipment:{} };
var chestOpen = false;
</script>

<canvas id="world-view-canvas"></canvas>
<script>

(function () {
  if (typeof THREE === "undefined") return; // three.js not loaded - game continues in 2D

  // ---------- Shared helpers ----------
  const animated = []; // objects with .tick(t)
  const tmpColor = new THREE.Color();

  function disposeObj(root) {
    root.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
      }
    });
  }

  function makeRenderer(canvas) {
    const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    r.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    r.outputEncoding = THREE.sRGBEncoding;
    r.toneMapping = THREE.ACESFilmicToneMapping;
    r.toneMappingExposure = 1.0;
    r.shadowMap.enabled = true;
    r.shadowMap.type = THREE.PCFSoftShadowMap;
    return r;
  }

  function fitRenderer(renderer, camera, canvas) {
    let w = canvas.clientWidth;
    let h = canvas.clientHeight;
    // fall back to parent box if canvas hasn't been stretched by CSS yet
    if ((!w || w < 40 || !h || h < 40) && canvas.parentElement) {
      w = canvas.parentElement.clientWidth || w;
      h = canvas.parentElement.clientHeight || h;
    }
    w = Math.max(40, w || 300);
    h = Math.max(40, h || 200);
    const pw = Math.round(w * renderer.getPixelRatio());
    if (canvas.width !== pw) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
  }

  function canvasTexture(size, painter, repeat) {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    painter(c.getContext("2d"), size);
    const tex = new THREE.CanvasTexture(c);
    if (repeat) {
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeat[0], repeat[1]);
    }
    return tex;
  }

  function groundTexture(base, fleck, flecks) {
    return canvasTexture(256, (g, s) => {
      g.fillStyle = base;
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < flecks; i++) {
        tmpColor.set(fleck).offsetHSL(0, 0, (Math.random() - 0.5) * 0.12);
        g.fillStyle = "#" + tmpColor.getHexString();
        g.globalAlpha = 0.25 + Math.random() * 0.4;
        const r = 1 + Math.random() * 3;
        g.beginPath();
        g.arc(Math.random() * s, Math.random() * s, r, 0, 7);
        g.fill();
      }
      g.globalAlpha = 1;
    }, [6, 6]);
  }

  function woodTexture() {
    return canvasTexture(128, (g, s) => {
      g.fillStyle = "#6b4a26";
      g.fillRect(0, 0, s, s);
      for (let i = 0; i < 14; i++) {
        g.strokeStyle = "rgba(40,24,10," + (0.25 + Math.random() * 0.3) + ")";
        g.lineWidth = 1 + Math.random() * 2;
        const y = Math.random() * s;
        g.beginPath();
        g.moveTo(0, y);
        g.bezierCurveTo(s * 0.3, y + 6 - Math.random() * 12, s * 0.6, y + 6 - Math.random() * 12, s, y);
        g.stroke();
      }
    });
  }

  function std(color, opts) {
    return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85, metalness: 0.05 }, opts || {}));
  }
  function metal(color, rough, m) {
    return new THREE.MeshStandardMaterial({ color, roughness: rough == null ? 0.35 : rough, metalness: m == null ? 0.85 : m });
  }

  const _cache = {};
  function box(w, h, d) { const k = "b" + w + "," + h + "," + d; return _cache[k] || (_cache[k] = new THREE.BoxGeometry(w, h, d)); }
  function sph(r, w, h) { const k = "s" + r + "," + (w || 12) + "," + (h || 10); return _cache[k] || (_cache[k] = new THREE.SphereGeometry(r, w || 12, h || 10)); }
  function cyl(rt, rb, h, seg) { const k = "c" + rt + "," + rb + "," + h + "," + (seg || 10); return _cache[k] || (_cache[k] = new THREE.CylinderGeometry(rt, rb, h, seg || 10)); }
  function cone(r, h, seg) { const k = "k" + r + "," + h + "," + (seg || 10); return _cache[k] || (_cache[k] = new THREE.ConeGeometry(r, h, seg || 10)); }

  function mesh(geo, mat, x, y, z, shadow) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x || 0, y || 0, z || 0);
    if (shadow !== false) { m.castShadow = true; m.receiveShadow = true; }
    return m;
  }
  function group() { return new THREE.Group(); }
  function add(parent, child, x, y, z) { child.position.set(x || 0, y || 0, z || 0); parent.add(child); return child; }

  // ---------- Materials shared across models ----------
  const M = {
    skin: std(0xd9a066, { roughness: 0.7 }),
    skinPale: std(0xc9b8a8, { roughness: 0.75 }),
    bone: std(0xe8e0cc, { roughness: 0.9 }),
    wood: new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: 0.9 }),
    darkWood: std(0x4a3220, { roughness: 0.9 }),
    iron: metal(0x9aa2ad, 0.4),
    darkIron: metal(0x565d68, 0.45),
    steel: metal(0xc9d2dc, 0.25),
    gold: metal(0xd4af37, 0.3),
    bronze: metal(0x8c6a3f, 0.45),
    mithril: metal(0x9fd4d8, 0.3),
    dragon: metal(0x8a2f2f, 0.4),
    ancient: metal(0xc9a227, 0.35),
    leather: std(0x7a5230, { roughness: 0.95 }),
    darkLeather: std(0x4a3320, { roughness: 0.95 }),
    clothBlue: std(0x2e4a8a, { roughness: 1 }),
    clothGreen: std(0x2e6b34, { roughness: 1 }),
    robe: std(0x3a2a5e, { roughness: 1 }),
    stone: std(0x8a8a8a, { roughness: 0.95 }),
    darkStone: std(0x4c4c52, { roughness: 0.95 }),
    black: std(0x14141a, { roughness: 0.9 })
  };
  function eyeMat(color) { return new THREE.MeshStandardMaterial({ color: 0x000000, emissive: color, emissiveIntensity: 1 }); }

  // ---------- Equipment / armor material picker ----------
  function gearMat(item, fallback) {
    if (!item || !item.name) return fallback || M.iron;
    const n = item.name.toLowerCase();
    if (n.indexOf("ancient") >= 0) return M.ancient;
    if (n.indexOf("dragon") >= 0) return M.dragon;
    if (n.indexOf("mithril") >= 0) return M.mithril;
    if (n.indexOf("gold") >= 0) return M.gold;
    if (n.indexOf("bronze") >= 0) return M.bronze;
    if (n.indexOf("dark") >= 0 || n.indexOf("shadow") >= 0) return M.darkIron;
    if (n.indexOf("steel") >= 0) return M.steel;
    if (n.indexOf("iron") >= 0) return M.iron;
    if (n.indexOf("leather") >= 0 || n.indexOf("starter") >= 0) return M.leather;
    if (n.indexOf("robe") >= 0 || n.indexOf("enchant") >= 0) return M.robe;
    return fallback || M.iron;
  }

  // ---------- 3D humanoid character builder ----------
  // opts: {armor: mat, trim: mat, helmet: mat|null, skin, bulk, robe, scale}
  function buildHumanoid(opts) {
    opts = opts || {};
    const skin = opts.skin || M.skin;
    const armor = opts.armor || M.leather;
    const trim = opts.trim || M.darkLeather;
    const g = group();
    const refs = {};

    // Legs
    const legL = group(), legR = group();
    legL.add(mesh(box(0.16, 0.5, 0.18), trim, 0, 0.25, 0));
    legR.add(mesh(box(0.16, 0.5, 0.18), trim, 0, 0.25, 0));
    legL.position.set(-0.13, 0, 0);
    legR.position.set(0.13, 0, 0);
    g.add(legL, legR);
    refs.legL = legL; refs.legR = legR;

    // Torso
    const torso = group();
    torso.position.y = 0.5;
    torso.add(mesh(box(0.46, 0.52, 0.26), armor, 0, 0.26, 0));
    // chest plate ridge
    torso.add(mesh(box(0.5, 0.14, 0.3), trim, 0, 0.42, 0));
    // belt
    torso.add(mesh(box(0.48, 0.07, 0.28), M.darkLeather, 0, 0.02, 0));
    g.add(torso);
    refs.torso = torso;

    // Arms
    function arm(side) {
      const a = group();
      a.add(mesh(box(0.13, 0.46, 0.15), armor, 0, -0.16, 0));
      a.add(mesh(sph(0.075, 8, 8), skin, 0, -0.42, 0));
      a.position.set(0.31 * side, 0.48, 0);
      return a;
    }
    const armL = arm(-1), armR = arm(1);
    torso.add(armL, armR);
    refs.armL = armL; refs.armR = armR;
    // weapon grip anchors
    refs.handR = group(); refs.handR.position.set(0, -0.44, 0.02); armR.add(refs.handR);
    refs.handL = group(); refs.handL.position.set(0, -0.44, 0.02); armL.add(refs.handL);

    // Head
    const head = group();
    head.position.y = 0.62;
    head.add(mesh(box(0.28, 0.28, 0.26), skin, 0, 0.14, 0));
    // eyes
    head.add(mesh(box(0.045, 0.05, 0.02), M.black, -0.07, 0.16, 0.135));
    head.add(mesh(box(0.045, 0.05, 0.02), M.black, 0.07, 0.16, 0.135));
    torso.add(head);
    refs.head = head;

    if (opts.scale) g.scale.setScalar(opts.scale);
    g.userData.refs = refs;
    animated.push({ obj: g, tick: opts.animate === false ? null : (t) => {
      const s = Math.sin(t * 2.2) * 0.02;
      torso.position.y = 0.5 + s;
      head.rotation.y = Math.sin(t * 0.6) * 0.25;
      armL.rotation.x = Math.sin(t * 2.2) * 0.08;
      armR.rotation.x = -Math.sin(t * 2.2) * 0.08;
    }});
    return g;
  }

  // ---------- Armor attachments (equipped gear shown on the model) ----------
  function attachEquipment(char, equipment) {
    const refs = char.userData.refs;
    // Clear previous gear
    ["helmetG", "armorG", "cloakG", "bootsG", "glovesG", "amuletG", "ringG", "weaponG", "shieldG"].forEach(k => {
      const node = refs[k];
      if (node) {
        (Array.isArray(node) ? node : [node]).forEach(n => {
          if (n && n.parent) { n.parent.remove(n); disposeObj(n); }
        });
        refs[k] = null;
      }
    });
    equipment = equipment || {};

    if (equipment.helmet) {
      const mat = gearMat(equipment.helmet, M.iron);
      const h = group();
      h.add(mesh(box(0.32, 0.16, 0.3), mat, 0, 0.26, 0));
      h.add(mesh(box(0.32, 0.05, 0.06), mat, 0, 0.16, 0.13)); // visor rim
      if (equipment.helmet.name && equipment.helmet.name.indexOf("Ancient") === 0) {
        h.add(mesh(cone(0.045, 0.18, 6), M.ancient, 0, 0.4, 0)); // crest
      }
      refs.head.add(h); refs.helmetG = h;
    }
    if (equipment.armor) {
      const mat = gearMat(equipment.armor, M.iron);
      const a = group();
      a.add(mesh(box(0.52, 0.4, 0.32), mat, 0, 0.3, 0));
      a.add(mesh(box(0.2, 0.2, 0.06), mat, 0, 0.34, 0.18)); // chest sigil plate
      // pauldrons
      a.add(mesh(sph(0.11, 8, 8), mat, -0.33, 0.5, 0));
      a.add(mesh(sph(0.11, 8, 8), mat, 0.33, 0.5, 0));
      refs.torso.add(a); refs.armorG = a;
    }
    if (equipment.cloak) {
      const nm = (equipment.cloak.name || "").toLowerCase();
      const mat = nm.indexOf("ancient") === 0 || nm.indexOf("ancient") >= 0 ? M.ancient :
        (nm.indexOf("robe") >= 0 ? M.robe : M.clothBlue);
      const c = group();
      const cloth = mesh(box(0.44, 0.72, 0.05), mat, 0, -0.28, -0.2);
      cloth.rotation.x = 0.12;
      c.add(cloth);
      c.position.y = 0.52;
      refs.torso.add(c); refs.cloakG = c;
      animated.push({ obj: c, tick: (t) => { cloth.rotation.x = 0.12 + Math.sin(t * 1.8) * 0.06; } });
    }
    if (equipment.boots) {
      const mat = gearMat(equipment.boots, M.leather);
      const bL = mesh(box(0.18, 0.12, 0.24), mat, 0, 0.06, 0.02);
      const bR = bL.clone();
      refs.legL.add(bL); refs.legR.add(bR);
      refs.bootsG = [bL, bR];
    }
    if (equipment.gloves) {
      const mat = gearMat(equipment.gloves, M.leather);
      const gL = mesh(box(0.15, 0.12, 0.17), mat, 0, -0.4, 0);
      const gR = mesh(box(0.15, 0.12, 0.17), mat, 0, -0.4, 0);
      refs.armL.add(gL); refs.armR.add(gR);
      refs.glovesG = [gL, gR];
    }
    if (equipment.amulet) {
      const mat = gearMat(equipment.amulet, M.gold);
      const am = mesh(sph(0.05, 8, 8), new THREE.MeshStandardMaterial({ color: 0x40c4ff, emissive: 0x1e88e5, emissiveIntensity: 0.8 }), 0, 0.42, 0.17);
      const chain = mesh(new THREE.TorusGeometry(0.09, 0.012, 6, 16), mat, 0, 0.46, 0.14);
      chain.rotation.x = Math.PI / 2.4;
      refs.torso.add(chain, am);
      refs.amuletG = [chain, am];
    }
    if (equipment.ring) {
      const rg = mesh(sph(0.035, 6, 6), gearMat(equipment.ring, M.gold), 0, 0, 0.06);
      refs.handR.add(rg);
      refs.ringG = rg;
    }
    if (equipment.weapon) {
      const nm = (equipment.weapon.name || "").toLowerCase();
      let w;
      if (nm.indexOf("bow") >= 0 || equipment.weapon.isBow) {
        w = group();
        const bowMat = M.wood;
        const arc = mesh(new THREE.TorusGeometry(0.34, 0.025, 6, 20, Math.PI), bowMat, 0, 0, 0);
        arc.rotation.z = -Math.PI / 2;
        w.add(arc);
        w.add(mesh(box(0.008, 0.66, 0.008), std(0xd8d8d8), 0, 0, 0.0));
        w.rotation.y = Math.PI / 2;
      } else if (nm.indexOf("staff") >= 0) {
        w = group();
        w.add(mesh(cyl(0.03, 0.03, 1.1, 8), M.wood, 0, 0.15, 0));
        const orb = mesh(sph(0.09, 10, 10), new THREE.MeshStandardMaterial({ color: 0x7c4dff, emissive: 0x651fff, emissiveIntensity: 1.2 }), 0, 0.76, 0);
        w.add(orb);
        animated.push({ obj: orb, tick: (t) => { orb.material.emissiveIntensity = 0.9 + Math.sin(t * 4) * 0.4; } });
      } else {
        // sword
        const mat = gearMat(equipment.weapon, M.steel);
        w = group();
        w.add(mesh(box(0.05, 0.62, 0.02), mat, 0, 0.45, 0));
        w.add(mesh(box(0.2, 0.04, 0.04), M.gold, 0, 0.12, 0));
        w.add(mesh(cyl(0.025, 0.025, 0.14, 8), M.darkLeather, 0, 0.03, 0));
        if (nm.indexOf("ancient") >= 0) {
          w.children[0].material = new THREE.MeshStandardMaterial({ color: 0xd7c27a, metalness: 0.8, roughness: 0.3, emissive: 0xffba3a, emissiveIntensity: 0.35 });
        }
      }
      refs.handR.add(w); refs.weaponG = w;
    }
    if (equipment.shield) {
      const mat = gearMat(equipment.shield, M.iron);
      const s = group();
      s.add(mesh(cyl(0.26, 0.26, 0.05, 18), mat, 0, 0, 0));
      s.add(mesh(sph(0.07, 8, 8), M.gold, 0, 0, 0.05));
      s.rotation.x = Math.PI / 2;
      s.rotation.z = 0.1;
      refs.handL.add(s); refs.shieldG = s;
    }
  }

  // ==================== MONSTER BUILDERS ====================
  function baseHumanoidMonster(opts) {
    const g = buildHumanoid(Object.assign({ animate: false }, opts));
    return g;
  }
  function monsterEyes(g, refs, color, y, spread, size) {
    const e = eyeMat(color);
    refs.head.add(mesh(box(size || 0.05, size || 0.05, 0.02), e, -(spread || 0.07), y == null ? 0.16 : y, 0.135));
    refs.head.add(mesh(box(size || 0.05, size || 0.05, 0.02), e, (spread || 0.07), y == null ? 0.16 : y, 0.135));
  }

  const monsterBuilders = {
    "Slime": () => {
      const g = group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x43a047, roughness: 0.3, transparent: true, opacity: 0.85, emissive: 0x1b5e20, emissiveIntensity: 0.25 });
      const body = mesh(sph(0.42, 14, 12), bodyMat, 0, 0.34, 0);
      body.scale.y = 0.78;
      const core = mesh(sph(0.16, 10, 8), new THREE.MeshStandardMaterial({ color: 0x1b5e20, emissive: 0x2e7d32, emissiveIntensity: 0.8 }), 0, 0.3, 0);
      g.add(body, core);
      const e = eyeMat(0x111111);
      g.add(mesh(sph(0.05, 6, 6), e, -0.14, 0.42, 0.33), mesh(sph(0.05, 6, 6), e, 0.14, 0.42, 0.33));
      animated.push({ obj: g, tick: t => { const s = 1 + Math.sin(t * 3) * 0.08; body.scale.set(s, 0.78 / s, s); } });
      return g;
    },
    "Goblin": () => {
      const g = baseHumanoidMonster({ skin: std(0x5f8f3e), armor: std(0x6d4c2f), trim: std(0x4a3320), scale: 0.75 });
      const r = g.userData.refs;
      monsterEyes(g, r, 0xffdd44, 0.18);
      // big ears
      r.head.add(mesh(cone(0.06, 0.22, 6), std(0x5f8f3e), -0.2, 0.16, 0));
      r.head.children[r.head.children.length - 1].rotation.z = Math.PI / 2.2;
      r.head.add(mesh(cone(0.06, 0.22, 6), std(0x5f8f3e), 0.2, 0.16, 0));
      r.head.children[r.head.children.length - 1].rotation.z = -Math.PI / 2.2;
      // jagged dagger
      const d = group();
      d.add(mesh(box(0.035, 0.3, 0.015), M.darkIron, 0, 0.2, 0));
      d.add(mesh(box(0.1, 0.03, 0.03), M.wood, 0, 0.03, 0));
      r.handR.add(d);
      return g;
    },
    "Wolf": () => {
      const g = group();
      const fur = std(0x6e6e78, { roughness: 1 });
      const darkFur = std(0x4a4a52, { roughness: 1 });
      const body = mesh(box(0.4, 0.38, 0.85), fur, 0, 0.5, 0);
      g.add(body);
      const head = group(); head.position.set(0, 0.68, 0.5);
      head.add(mesh(box(0.28, 0.26, 0.3), fur, 0, 0, 0));
      head.add(mesh(box(0.14, 0.12, 0.18), darkFur, 0, -0.04, 0.22)); // snout
      head.add(mesh(box(0.05, 0.04, 0.03), M.black, 0, -0.03, 0.32)); // nose
      head.add(mesh(cone(0.06, 0.14, 4), darkFur, -0.1, 0.18, -0.02));
      head.add(mesh(cone(0.06, 0.14, 4), darkFur, 0.1, 0.18, -0.02));
      const e = eyeMat(0xffb300);
      head.add(mesh(sph(0.035, 6, 6), e, -0.08, 0.05, 0.15), mesh(sph(0.035, 6, 6), e, 0.08, 0.05, 0.15));
      g.add(head);
      const legs = [];
      [[-0.14, 0.28], [0.14, 0.28], [-0.14, -0.28], [0.14, -0.28]].forEach(p => {
        const l = mesh(box(0.1, 0.42, 0.1), darkFur, p[0], 0.21, p[1]);
        legs.push(l); g.add(l);
      });
      const tail = mesh(box(0.08, 0.08, 0.34), fur, 0, 0.6, -0.55);
      tail.rotation.x = -0.5;
      g.add(tail);
      animated.push({ obj: g, tick: t => {
        tail.rotation.z = Math.sin(t * 5) * 0.25;
        legs.forEach((l, i) => { l.rotation.x = Math.sin(t * 4 + i * 1.6) * 0.18; });
        body.position.y = 0.5 + Math.sin(t * 4) * 0.015;
      } });
      return g;
    },
    "Bandit": () => {
      const g = baseHumanoidMonster({ skin: M.skin, armor: std(0x3e3a34), trim: std(0x2a2724) });
      const r = g.userData.refs;
      // hood & mask
      r.head.add(mesh(box(0.34, 0.3, 0.32), std(0x2a2724), 0, 0.18, -0.01));
      r.head.add(mesh(box(0.3, 0.09, 0.05), std(0x2a2724), 0, 0.05, 0.14));
      monsterEyes(g, r, 0xffffff, 0.17, 0.07, 0.04);
      const d = group();
      d.add(mesh(box(0.04, 0.34, 0.015), M.steel, 0, 0.24, 0));
      d.add(mesh(box(0.12, 0.035, 0.035), M.darkLeather, 0, 0.04, 0));
      r.handR.add(d);
      return g;
    },
    "Orc": () => {
      const g = baseHumanoidMonster({ skin: std(0x4e7a34), armor: M.darkIron, trim: M.darkLeather, scale: 1.18 });
      const r = g.userData.refs;
      r.torso.children[0].scale.set(1.3, 1.1, 1.2); // bulky torso
      monsterEyes(g, r, 0xff2222, 0.17);
      // tusks
      r.head.add(mesh(cone(0.025, 0.08, 5), M.bone, -0.07, 0.05, 0.13));
      r.head.add(mesh(cone(0.025, 0.08, 5), M.bone, 0.07, 0.05, 0.13));
      // pauldrons with spikes
      [[-1], [1]].forEach(s => {
        const p = mesh(sph(0.14, 8, 8), M.darkIron, 0.34 * s[0], 0.52, 0);
        r.torso.add(p);
        const sp = mesh(cone(0.035, 0.14, 5), M.iron, 0.36 * s[0], 0.66, 0);
        r.torso.add(sp);
      });
      // axe
      const a = group();
      a.add(mesh(cyl(0.03, 0.03, 0.8, 8), M.wood, 0, 0.3, 0));
      a.add(mesh(box(0.05, 0.22, 0.3), M.darkIron, 0, 0.62, 0.12));
      r.handR.add(a);
      return g;
    },

  // ==================== AREA ENVIRONMENTS ====================
  function addGround(scene, color, fleck, size) {
    const g = new THREE.Mesh(
      new THREE.PlaneGeometry(size || 26, size || 26),
      new THREE.MeshStandardMaterial({ map: groundTexture(color, fleck, 900), roughness: 1 })
    );
    g.rotation.x = -Math.PI / 2;
    g.receiveShadow = true;
    scene.add(g);
    return g;
  }
  function addSky(scene, top, bottom, fogColor, fogNear, fogFar) {
    window.__skyLog = window.__skyLog || [];
    const c = new THREE.Color(top);
    window.__skyLog.push('arg scene isScene=' + (scene && scene.isScene) + ' sameAsWorld=' + (scene === worldScene));
    scene.background = c;
    window.__skyLog.push('after assign scene.bg=' + (scene.background && scene.background.getHexString()) + ' worldScene.bg=' + (worldScene.background && worldScene.background.getHexString()) + ' sameColorObj=' + (scene.background === c));
    scene.fog = new THREE.Fog(fogColor != null ? fogColor : top, fogNear || 10, fogFar || 26);
  }
  function scatter(scene, count, radius, maker) {
    const made = [];
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 3.5 + Math.random() * radius;
      const o = maker(i);
      o.position.set(Math.cos(a) * r, o.position.y, Math.sin(a) * r);
      o.rotation.y = Math.random() * Math.PI * 2;
      scene.add(o);
      made.push(o);
    }
    return made;
  }

  function makeChest() {
    const g = group();
    const woodMat = new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: 0.85 });
    const goldTrim = M.gold;
    const base = mesh(box(0.9, 0.45, 0.55), woodMat, 0, 0.225, 0);
    const lid = group();
    lid.position.set(0, 0.45, -0.275);
    const lidMesh = mesh(box(0.9, 0.28, 0.55), woodMat, 0, 0.14, 0.275);
    lid.add(lidMesh);
    // gold bands
    const band1 = mesh(box(0.94, 0.06, 0.59), goldTrim, 0, 0.14, 0.275);
    lid.add(band1);
    g.add(base, lid);
    g.add(mesh(box(0.94, 0.06, 0.59), goldTrim, 0, 0.35, 0));
    g.add(mesh(box(0.12, 0.14, 0.04), goldTrim, 0, 0.42, 0.29)); // lock
    const glow = new THREE.PointLight(0xffd54f, 0, 3);
    glow.position.set(0, 0.7, 0);
    g.add(glow);
    g.userData.openChest = () => {
      if (g.userData._opened) return;
      g.userData._opened = true;
      glow.intensity = 1.5;
      const target = -1.8;
      const start = lid.rotation.x;
      const t0 = performance.now();
      function anim() {
        const p = Math.min(1, (performance.now() - t0) / 600);
        lid.rotation.x = start + (target - start) * (1 - Math.pow(1 - p, 3));
        if (p < 1) requestAnimationFrame(anim);
      }
      anim();
    };
    animated.push({ obj: g, tick: t => {
      if (!g.userData._opened) g.position.y = Math.sin(t * 2) * 0.03;
      else glow.intensity = 1.2 + Math.sin(t * 4) * 0.4;
    } });
    return g;
  }

    g.add(mesh(new THREE.DodecahedronGeometry(1.1), rockMat, 0, 0.3, 0));
    g.add(mesh(new THREE.DodecahedronGeometry(0.7), darkRock, -0.8, 0.2, 0.3));
    g.add(mesh(new THREE.DodecahedronGeometry(0.7), darkRock, 0.8, 0.2, 0.3));
    // arch
    g.add(mesh(box(0.35, 1.5, 0.5), darkRock, -0.75, 0.75, 0.6));
    g.add(mesh(box(0.35, 1.5, 0.5), darkRock, 0.75, 0.75, 0.6));
    g.add(mesh(box(1.9, 0.4, 0.55), rockMat, 0, 1.65, 0.6));
    // dark opening
    const hole = mesh(new THREE.CircleGeometry(0.62, 20), new THREE.MeshBasicMaterial({ color: 0x030308 }), 0, 0.72, 0.62, false);
    g.add(hole);

    const glow = new THREE.PointLight(0x7c4dff, 0.8, 3);
    glow.position.set(0, 0.7, 0.8);
    g.add(glow);
    animated.push({ obj: g, tick: t => { glow.intensity = 0.6 + Math.sin(t * 2.5) * 0.3; } });
    return g;
  }
  function makeStalagmite() {
    const g = group();
    g.add(mesh(cone(0.22, 0.9, 7), std(0x6a6a70, { roughness: 1 }), 0, 0.45, 0));
    g.add(mesh(cone(0.12, 0.5, 6), std(0x5a5a60), 0.2, 0.25, 0.1));
    return g;
  }
  function makePillar() {
    const g = group();
    g.add(mesh(box(0.4, 0.25, 0.4), M.stone, 0, 0.12, 0));
    g.add(mesh(cyl(0.14, 0.16, 1.3, 8), M.stone, 0, 0.9, 0));
    g.add(mesh(box(0.4, 0.18, 0.4), M.stone, 0, 1.6, 0));
    return g;
  }
  function makeCactus() {
    const g = group();
    const c = std(0x4a7a3a, { roughness: 0.9 });
    g.add(mesh(cyl(0.12, 0.14, 1.1, 7), c, 0, 0.55, 0));
    const a1 = mesh(cyl(0.08, 0.08, 0.45, 6), c, -0.22, 0.6, 0);
    a1.rotation.z = 0.9;
    const a2 = mesh(cyl(0.08, 0.08, 0.4, 6), c, 0.2, 0.75, 0);
    a2.rotation.z = -0.9;
    g.add(a1, a2);
    return g;
  }
  function makeMushroom() {
    const g = group();
    g.add(mesh(cyl(0.06, 0.08, 0.25, 6), std(0xd8cfc0), 0, 0.12, 0));
    const cap = mesh(sph(0.16, 8, 6), std(0x8a4a3a), 0, 0.28, 0);
    cap.scale.y = 0.55;
    g.add(cap);
    return g;
  }

  // Environment definitions: sky colors + prop scatterers
  const environments = {
    "Plains": (scene) => {
      addSky(scene, 0x87b5e0, 0, 0xa8c8e8, 12, 30);
      addGround(scene, "#5d8a3c", "#7fae54", 28);
      scatter(scene, 10, 9, () => mesh(cone(0.06, 0.3, 4), std(0x4a7a30), 0, 0.15, 0)); // grass tufts
      scatter(scene, 4, 10, () => makeRock(0.5));
      scatter(scene, 2, 11, () => makeTree(0.8));
    },
    "Forest": (scene) => {
      addSky(scene, 0x4a6a4a, 0, 0x3a5a3a, 9, 24);
      addGround(scene, "#3d5a2a", "#527a3a", 28);
      scatter(scene, 16, 10, () => makeTree(0.7 + Math.random() * 0.7));
      scatter(scene, 6, 8, () => makeMushroom());
    },
    "Mountain": (scene) => {
      addSky(scene, 0x9aa8b8, 0, 0x8a98a8, 11, 28);
      addGround(scene, "#6f7076", "#8a8b92", 28);
      scatter(scene, 12, 9, () => makeRock(0.6 + Math.random() * 1.2));
      // snow caps on some rocks
      scatter(scene, 4, 10, () => {
        const r = makeRock(1.1, 0x8a8b92);
        r.add(mesh(cone(0.28, 0.3, 6), std(0xf4f8ff, { roughness: 0.6 }), 0, 0.62, 0));
        return r;
      });
    },
    "River": (scene) => {
      addSky(scene, 0x8fc4e8, 0, 0xa8d0e8, 12, 30);
      addGround(scene, "#557f3a", "#74a04e", 28);
      // water strip
      const water = new THREE.Mesh(
        new THREE.PlaneGeometry(26, 5),
        new THREE.MeshStandardMaterial({ color: 0x3d7ac2, roughness: 0.15, metalness: 0.4, transparent: true, opacity: 0.85 })
      );
      water.rotation.x = -Math.PI / 2;
      water.rotation.z = 0.4;
      water.position.y = 0.03;
      water.receiveShadow = true;
      scene.add(water);
      animated.push({ obj: water, tick: t => { water.position.y = 0.03 + Math.sin(t * 1.5) * 0.015; water.material.opacity = 0.8 + Math.sin(t * 2) * 0.05; } });
      // stepping stones
      for (let i = -2; i <= 2; i++) scene.add(mesh(new THREE.DodecahedronGeometry(0.22), M.stone, i * 1.1 + Math.sin(i) * 0.3, 0.08, i * 0.45 * -1 + 0.5));
      scatter(scene, 6, 9, () => makeTree(0.7));
      // reeds
      scatter(scene, 8, 6, () => mesh(cyl(0.02, 0.03, 0.6, 4), std(0x6a8a3a), 0, 0.3, 0));
    },
    "Ruins": (scene) => {
      addSky(scene, 0x8a8578, 0, 0x7a7568, 10, 26);
      addGround(scene, "#6a6558", "#857f70", 28);
      scatter(scene, 6, 8, () => makePillar());
      scatter(scene, 3, 9, () => {
        const p = makePillar();
        p.rotation.z = (Math.random() - 0.5) * 0.6;

      });

    },
    "Cave": (scene) => {
      addSky(scene, 0x0a0a12, 0, 0x0a0a12, 6, 18);
      addGround(scene, "#3a3a42", "#4c4c55", 28);
      scatter(scene, 14, 9, () => makeStalagmite());
      // glowing crystals
      scatter(scene, 5, 8, () => {
        const c = mesh(new THREE.OctahedronGeometry(0.16), new THREE.MeshStandardMaterial({ color: 0x84ffff, emissive: 0x00acc1, emissiveIntensity: 1 }), 0, 0.16, 0);
        return c;
      });
      const torch = makeTorch();
      torch.position.set(2.2, 0, -1.5);
      scene.add(torch);
    },
    "Desert": (scene) => {
      addSky(scene, 0xe8c88a, 0, 0xe0bd80, 12, 30);
      addGround(scene, "#d8bc85", "#cbb083", 28);
      scatter(scene, 6, 9, () => makeCactus());
      scatter(scene, 5, 8, () => makeRock(0.5, 0xc2a878));
      // dunes
      scatter(scene, 4, 10, () => {
        const d = mesh(sph(1.2, 10, 8), std(0xd8bc85, { roughness: 1 }), 0, -0.7, 0);
        d.scale.set(1.6, 0.6, 1.2);
        return d;
      });
      // vulture bones
      const bones = group();
      bones.add(mesh(cyl(0.03, 0.03, 0.8, 5), M.bone, 0, 0.05, 0));
      bones.children[0].rotation.z = Math.PI / 2.2;
      bones.position.set(-1.8, 0, 1.4);
      scene.add(bones);
    },
    "Swamp": (scene) => {
      addSky(scene, 0x4a5a48, 0, 0x3d4c3c, 8, 22);
      addGround(scene, "#3f4c38", "#55624b", 28);
      // murky pools
      for (let i = 0; i < 3; i++) {
        const pool = new THREE.Mesh(new THREE.CircleGeometry(1 + Math.random(), 14),
          new THREE.MeshStandardMaterial({ color: 0x2a3d2a, roughness: 0.3, transparent: true, opacity: 0.85 }));
        pool.rotation.x = -Math.PI / 2;
        pool.position.set((Math.random() - 0.5) * 12, 0.02, (Math.random() - 0.5) * 12);
        scene.add(pool);
      }
      scatter(scene, 8, 9, () => makeDeadTree());
      // fireflies / spores
      const fireflies = [];
      const fm = new THREE.MeshBasicMaterial({ color: 0xc6ff00, transparent: true, opacity: 0.8 });
      for (let i = 0; i < 12; i++) {
        const f = mesh(sph(0.025, 5, 5), fm, 0, 0, 0, false);
        fireflies.push(f); scene.add(f);
      }
      animated.push({ obj: scene, tick: t => {
        fireflies.forEach((f, i) => {
          f.position.set(Math.sin(t * 0.7 + i * 1.7) * 6, 0.4 + Math.sin(t * 1.3 + i) * 0.5, Math.cos(t * 0.5 + i * 2.3) * 6);
        });
      } });
    },
    "Valley": (scene) => {
      addSky(scene, 0x92b8dc, 0, 0xa8c8e8, 12, 30);
      addGround(scene, "#5f8f42", "#7fb058", 28);
      // flanking cliffs
      [[-7], [7]].forEach(s => {
        const cliff = mesh(box(3.5, 4.5, 26), std(0x7a7268, { roughness: 1 }), s[0], 1.6, 0);
        cliff.receiveShadow = true;
        scene.add(cliff);
        // greenery on top
        scene.add(mesh(box(3.6, 0.3, 26), std(0x5f8f42), s[0], 3.95, 0));
      });
      scatter(scene, 5, 5, () => makeTree(0.6));
      scatter(scene, 8, 5, () => mesh(cone(0.05, 0.25, 4), std(0x4a7a30), 0, 0.12, 0));
    },
    "Hills": (scene) => {
      addSky(scene, 0x8ab2d8, 0, 0xa0c2e0, 12, 30);
      addGround(scene, "#5a8540", "#78a252", 28);
      // rolling hills
      [[-5, -6], [5, -7], [-6, 5], [6, 6], [0, -9]].forEach(p => {
        const h = mesh(sph(2.2, 12, 10), std(0x5a8540, { roughness: 1 }), p[0], -1.2, p[1]);
        h.scale.set(1.4, 0.55, 1.2);
        h.receiveShadow = true;
        scene.add(h);
      });
      scatter(scene, 6, 8, () => makeTree(0.7 + Math.random() * 0.4));
    }
  };
  function buildTownEnv(scene, central) {
    addSky(scene, central ? 0xc8964a : 0x8ab2d8, 0, central ? 0xd8a85a : 0xa0c2e0, 12, 30);
    addGround(scene, "#8a7a5a", "#a08a68", 28);
    // cobble center
    const plaza = new THREE.Mesh(new THREE.CircleGeometry(3.2, 20), std(0x8a8578, { roughness: 1 }));
    plaza.rotation.x = -Math.PI / 2;
    plaza.position.y = 0.015;
    plaza.receiveShadow = true;
    scene.add(plaza);
    scatter(scene, central ? 6 : 4, 7, () => makeHouse());
    // torches ringing plaza
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2 + 0.4;
      const t = makeTorch();
      t.position.set(Math.cos(a) * 3.4, 0, Math.sin(a) * 3.4);
      scene.add(t);
    }
    if (central) {
      // central fountain/statue
      const f = group();
      f.add(mesh(cyl(0.9, 1.05, 0.35, 12), M.stone, 0, 0.17, 0));
      f.add(mesh(cyl(0.12, 0.15, 0.8, 8), M.stone, 0, 0.7, 0));
      const water = mesh(cyl(0.8, 0.8, 0.08, 12), new THREE.MeshStandardMaterial({ color: 0x4a9ad8, roughness: 0.15, metalness: 0.4 }), 0, 0.36, 0);
      f.add(water);
      animated.push({ obj: f, tick: t => { water.rotation.y = t * 0.6; } });
      scene.add(f);
    }
  }
  function buildChestEnv(scene) {
    addSky(scene, 0x2a2418, 0, 0x241f14, 8, 22);
    addGround(scene, "#4c4232", "#60553f", 28);
    scatter(scene, 8, 9, () => makeRock(0.5));
    const torch = makeTorch();
    torch.position.set(-2.2, 0, -1.2);
    scene.add(torch);
  }
  function buildTunnelEnv(scene) {
    addSky(scene, 0x05050a, 0, 0x05050a, 5, 16);
    addGround(scene, "#33333a", "#45454e", 28);
    scatter(scene, 12, 8, () => makeStalagmite());
    // cave-in walls around
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const r = mesh(new THREE.DodecahedronGeometry(1.4 + Math.random()), std(0x3f3f46, { roughness: 1 }), Math.cos(a) * 11, 0.4, Math.sin(a) * 11);
      scene.add(r);
    }
    const torch = makeTorch();
    torch.position.set(2.0, 0, -1.0);
    scene.add(torch);
  }

  function buildEnvironment(scene, cell) {
    const type = cell && cell.type;
    const name = (cell && cell.name) || "Plains";
    if (type === "central-town") return buildTownEnv(scene, true);
    if (type === "town") return buildTownEnv(scene, false);
    if (type === "chest") return buildChestEnv(scene);
    if (type === "tunnel") return buildTunnelEnv(scene);
    (environments[name] || environments["Plains"])(scene);
  }

  // ==================== WORLD VIEW SCENE ====================
  const worldCanvas = document.getElementById("world-view-canvas");
  let worldRenderer = null, worldScene = null, worldCamera = null;
  let envGroup = null, actorGroup = null;
  let worldChar = null, worldMonster = null, worldChest = null, worldTunnel = null;
  let currentCellKey = "";

  function initWorld() {
    if (!worldCanvas || worldRenderer) return;
    worldRenderer = makeRenderer(worldCanvas);
    worldScene = new THREE.Scene();
    worldCamera = new THREE.PerspectiveCamera(50, 2, 0.1, 100);
    worldCamera.position.set(0, 2.1, 5.4);
    worldCamera.lookAt(0, 1.0, 0);

    const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x2a2a22, 0.55);
    worldScene.add(hemi);
    const sun = new THREE.DirectionalLight(0xfff2d8, 0.9);
    sun.position.set(4, 8, 5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = sun.shadow.camera.bottom = -12;
    sun.shadow.camera.right = sun.shadow.camera.top = 12;
    worldScene.add(sun);

    envGroup = group();
    actorGroup = group();
    worldScene.add(envGroup, actorGroup);
  }

  function clearGroup(g) {
    while (g.children.length) {
      const c = g.children[0];
      g.remove(c);
      disposeObj(c);
    }
    // drop tick handlers bound to removed objects
    for (let i = animated.length - 1; i >= 0; i--) {
      if (!animated[i].obj.parent && animated[i].obj !== worldScene) animated.splice(i, 1);
    }
  }

  function refreshWorld(force) {
    if (!worldRenderer) return;
    if (typeof mapData === "undefined" || !mapData.length || typeof playerPosition === "undefined") return;
    const cell = mapData[playerPosition.y] && mapData[playerPosition.y][playerPosition.x];
    if (!cell) return;
    const key = playerPosition.x + "," + playerPosition.y + ":" + cell.type + ":" + (cell.name || "");
    if (key !== currentCellKey || force) {
      currentCellKey = key;
      clearGroup(envGroup);
      buildEnvironment(envGroup, cell);
      // feature props
      if (worldTunnel) { actorGroup.remove(worldTunnel); disposeObj(worldTunnel); worldTunnel = null; }
      if (worldChest) { actorGroup.remove(worldChest); disposeObj(worldChest); worldChest = null; }
      if (cell.type === "tunnel") {
        worldTunnel = makeTunnelEntrance();
        worldTunnel.position.set(-1.2, 0, -2.2);
        actorGroup.add(worldTunnel);
      } else if (cell.type === "chest" && !(typeof chestOpen !== "undefined" && chestOpen)) {
        worldChest = makeChest();
        worldChest.position.set(1.4, 0, -1.6);
        actorGroup.add(worldChest);
      }
    }
    // player character standing in the scene
    if (!worldChar) {
      worldChar = buildHumanoid({ armor: M.clothBlue, trim: M.leather });
      worldChar.position.set(0, 0, 0.4);
      worldChar.rotation.y = Math.PI;
      actorGroup.add(worldChar);
    }
    refreshWorldEquipment();
  }

  function refreshWorldEquipment() {
    if (!worldChar) return;
    const eq = (typeof player !== "undefined" && player && player.equipment) || {};
    const cls = (typeof player !== "undefined" && player && player.class || "").toLowerCase();
    const base = cls === "mage" ? { armor: M.robe, trim: M.robe } :
      cls === "ranger" ? { armor: M.clothGreen, trim: M.leather } :
      { armor: M.clothBlue, trim: M.leather };
    worldChar.userData.refs.torso.children[0].material = eq.armor ? gearMat(eq.armor, base.armor) : base.armor;
    worldChar.userData.refs.torso.children[1].material = base.trim;
    attachEquipment(worldChar, eq);
  }

  // ==================== PORTRAIT VIEW ====================
  const portraitEl = document.getElementById("char-portrait");
  let portraitRenderer = null, portraitScene = null, portraitCamera = null, portraitChar = null;
  function initPortrait() {
    if (!portraitEl || portraitRenderer) return;
    const c = document.createElement("canvas");
    portraitEl.innerHTML = "";
    portraitEl.appendChild(c);
    portraitRenderer = makeRenderer(c);
    portraitScene = new THREE.Scene();
    portraitScene.background = new THREE.Color(0x1c1e24);
    portraitCamera = new THREE.PerspectiveCamera(42, 1, 0.1, 50);
    portraitCamera.position.set(0, 1.05, 2.6);
    portraitCamera.lookAt(0, 0.85, 0);
    portraitScene.add(new THREE.HemisphereLight(0xcfe8ff, 0x33302a, 0.6));
    const key = new THREE.DirectionalLight(0xffe8c8, 0.9);
    key.position.set(2, 3, 3);
    key.castShadow = true;
    portraitScene.add(key);
    const rim = new THREE.DirectionalLight(0x6a8aff, 0.4);
    rim.position.set(-2, 2, -2);
    portraitScene.add(rim);
    const floor = new THREE.Mesh(new THREE.CircleGeometry(1.1, 24), std(0x2a2c34, { roughness: 0.9 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    portraitScene.add(floor);
    refreshPortrait();
  }
  function refreshPortrait() {
    if (!portraitRenderer) return;
    if (portraitChar) { portraitScene.remove(portraitChar); disposeObj(portraitChar); }
    const cls = (typeof player !== "undefined" && player && player.class || "").toLowerCase();
    const base = cls === "mage" ? { armor: M.robe, trim: M.robe } :
      cls === "ranger" ? { armor: M.clothGreen, trim: M.leather } :
      { armor: M.clothBlue, trim: M.leather };
    portraitChar = buildHumanoid(base);
    portraitScene.add(portraitChar);
    attachEquipment(portraitChar, (typeof player !== "undefined" && player && player.equipment) || {});
    animated.push({ obj: portraitChar, tick: () => { if (portraitChar) portraitChar.rotation.y += 0.008; } });
  }

  // ==================== ENEMY VIEW ====================
  const enemyEl = document.getElementById("enemy-image");
  let enemyRenderer = null, enemyScene = null, enemyCamera = null, enemyModel = null;
  function initEnemy() {
    if (!enemyEl) return;
    if (enemyRenderer) {
      // orig renderEnemyEncounter() wipes imageBox.innerHTML each call - re-attach our canvas
      if (enemyRenderer.domElement.parentNode !== enemyEl) enemyEl.appendChild(enemyRenderer.domElement);
      return;
    }
    const c = document.createElement("canvas");
    enemyEl.appendChild(c);
    enemyRenderer = makeRenderer(c);
    enemyScene = new THREE.Scene();
    enemyScene.background = new THREE.Color(0x1c1e24);
    enemyCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 50);
    enemyCamera.position.set(0, 1.2, 3.1);
    enemyCamera.lookAt(0, 0.8, 0);
    enemyScene.add(new THREE.HemisphereLight(0xd0e4ff, 0x30281e, 0.6));
    const key = new THREE.DirectionalLight(0xfff0d8, 0.9);
    key.position.set(2.5, 4, 3);
    key.castShadow = true;
    enemyScene.add(key);
    const floor = new THREE.Mesh(new THREE.CircleGeometry(1.4, 24), std(0x26262e, { roughness: 0.95 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    enemyScene.add(floor);
  }
  function setEnemy(name) {
    if (!enemyRenderer) return;
    if (enemyModel) { enemyScene.remove(enemyModel); disposeObj(enemyModel); enemyModel = null; }
    if (!name) return;
    enemyModel = buildMonster(name);
    // frame bigger models
    const scale = enemyModel.scale.x;
    enemyCamera.position.set(0, 1.2 * Math.max(1, scale * 0.9), 3.1 * Math.max(1, scale * 0.8));
    enemyCamera.lookAt(0, 0.8 * Math.max(1, scale * 0.85), 0);
    enemyScene.add(enemyModel);
    // slow menacing turn
    animated.push({ obj: enemyModel, tick: () => { if (enemyModel) enemyModel.rotation.y += 0.006; } });
  }
  function setWorldMonster(name) {
    if (worldMonster) { actorGroup.remove(worldMonster); disposeObj(worldMonster); worldMonster = null; }
    if (!name || !worldRenderer) return;
    worldMonster = buildMonster(name);
    worldMonster.position.set(0, 0, -2.0);
    actorGroup.add(worldMonster);
  }

  // ==================== GAME HOOKS ====================
  function safe(fn) { try { fn && fn(); } catch (e) { /* 3D view must never break gameplay */ } }

  if (typeof renderEquipment === "function") {
    const orig = renderEquipment;
    renderEquipment = function () {
      orig.apply(this, arguments);
      safe(() => { initPortrait(); refreshPortrait(); refreshWorldEquipment(); });
    };
  }
  if (typeof renderEnemyEncounter === "function") {
    const orig = renderEnemyEncounter;
    renderEnemyEncounter = function () {
      orig.apply(this, arguments);
      safe(() => {
        initEnemy();
        const name = (typeof currentEnemy !== "undefined" && currentEnemy) ? currentEnemy.name : null;
        setEnemy(name);
        setWorldMonster(name);
      });
    };
  }
  if (typeof renderMap === "function") {
    const orig = renderMap;
    renderMap = function () {
      orig.apply(this, arguments);
      safe(() => { initWorld(); refreshWorld(); });
    };
  }
  if (typeof openChest === "function") {
    const orig = openChest;
    openChest = function () {
      // pre-create the chest so the opening animation is visible
      safe(() => {
        initWorld(); refreshWorld(true);
        if (!worldChest) {
          worldChest = makeChest();
          worldChest.position.set(1.4, 0, -1.6);
          actorGroup.add(worldChest);
        }
        worldChest.userData.openChest();
      });
      orig.apply(this, arguments);
    };
  }
  if (typeof closeChest === "function") {
    const orig = closeChest;
    closeChest = function () {
      orig.apply(this, arguments);
      safe(() => { currentCellKey = ""; refreshWorld(true); });
    };
  }
  if (typeof showSecretTunnelPopup === "function") {
    const orig = showSecretTunnelPopup;
    showSecretTunnelPopup = function () {
      safe(() => {
        initWorld();
        if (!worldTunnel) {
          worldTunnel = makeTunnelEntrance();
          worldTunnel.position.set(-1.2, 0, -2.2);
          actorGroup.add(worldTunnel);
        }
      });
      orig.apply(this, arguments);
    };
  }
  if (typeof updateAllStats === "function") {
    const orig = updateAllStats;
    updateAllStats = function () {
      orig.apply(this, arguments);
      safe(() => { initPortrait(); refreshPortrait(); });
    };
  }
  if (typeof applyGameSave === "function") {
    const orig = applyGameSave;
    applyGameSave = function (sd) {
      const r = orig.apply(this, arguments);
      safe(() => {
        initWorld(); currentCellKey = "";
        refreshWorld(true);
        initPortrait(); refreshPortrait();
      });
      return r;
    };
  }

  // ==================== RENDER LOOP ====================
  const clock = new THREE.Clock();
  function loop() {
    requestAnimationFrame(loop);
    const t = clock.getElapsedTime();
    for (let i = 0; i < animated.length; i++) {
      try { animated[i].tick && animated[i].tick(t); } catch (e) {}
    }
    if (worldRenderer && worldCanvas.offsetParent !== null) {
      fitRenderer(worldRenderer, worldCamera, worldCanvas);
      worldRenderer.render(worldScene, worldCamera);
    }
    if (portraitRenderer) {
      const c = portraitRenderer.domElement;
      if (c.offsetParent !== null) {
        fitRenderer(portraitRenderer, portraitCamera, c);
        portraitRenderer.render(portraitScene, portraitCamera);
      }
    }
    if (enemyRenderer) {
      const c = enemyRenderer.domElement;
      if (c.offsetParent !== null) {
        fitRenderer(enemyRenderer, enemyCamera, c);
        enemyRenderer.render(enemyScene, enemyCamera);
      }
    }
  }
  loop();

  // Boot once the game UI exists
  function boot() {
    safe(() => { initWorld(); refreshWorld(true); });
    safe(() => { initPortrait(); });
    safe(() => { initEnemy(); });
  }
  if (document.readyState === "complete" || document.readyState === "interactive") setTimeout(boot, 400);
  else document.addEventListener("DOMContentLoaded", () => setTimeout(boot, 400));
})();

</script>
</body></html>
